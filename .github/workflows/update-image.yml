---
name: Update image

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "assets/**"
      - ".github/bazzite-digests"
      - ".github/workflows/**"

  schedule:
    - cron: '05 10 * * *'

  push:
    branches: [main]
    paths-ignore:
      - "**/README.md"
      - "assets/**"
      - ".github/bazzite-digests"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild"
        required: false
        default: false
        type: boolean

env:
  IMAGE_DESC: "My customized Universal Blue Image mashup featuring Bazzite, DMS, and niri"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue,bazzite,dms,niri"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  check_base_images:
    name: Check for new base images
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      changed: ${{ steps.check.outputs.changed }}
      standard: ${{ steps.check.outputs.standard }}
      nvidia: ${{ steps.check.outputs.nvidia }}
      nouveau: ${{ steps.check.outputs.nouveau }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Check digests
        id: check
        run: |
          mkdir -p .github

          STANDARD=$(skopeo inspect docker://ghcr.io/ublue-os/bazzite-gnome:stable | jq -r .Digest)
          NVIDIA=$(skopeo inspect docker://ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable | jq -r .Digest)
          NOUVEAU=$(skopeo inspect docker://ghcr.io/ublue-os/bazzite-gnome-nvidia:stable | jq -r .Digest)

          OLD_STANDARD=$(grep '^standard=' .github/bazzite-digests | cut -d= -f2)
          OLD_NVIDIA=$(grep '^nvidia=' .github/bazzite-digests | cut -d= -f2)
          OLD_NOUVEAU=$(grep '^nouveau=' .github/bazzite-digests | cut -d= -f2)

          if [ "$STANDARD" != "$OLD_STANDARD" ] || \
             [ "$NVIDIA" != "$OLD_NVIDIA" ] || \
             [ "$NOUVEAU" != "$OLD_NOUVEAU" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
          else
              echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "standard=$STANDARD" >> "$GITHUB_OUTPUT"
          echo "nvidia=$NVIDIA" >> "$GITHUB_OUTPUT"
          echo "nouveau=$NOUVEAU" >> "$GITHUB_OUTPUT"

  build_push:
    name: Build and push image

    needs: check_base_images

    if: |
      always() &&
      (
        github.event_name != 'schedule' ||
        needs.check_base_images.outputs.changed == 'true' ||
        github.event.inputs.force == 'true'
      )

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: ""
            base_image: "ghcr.io/ublue-os/bazzite-gnome:stable"

          - variant: "nvidia"
            base_image: "ghcr.io/ublue-os/bazzite-gnome-nvidia-open:stable"

          - variant: "nouveau"
            base_image: "ghcr.io/ublue-os/bazzite-gnome-nvidia:stable"

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare environment
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Get current date
        id: date
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Image Metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          tags: |
            type=raw,value=${{ env.DEFAULT_TAG }}
            type=raw,value=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,enable=${{ github.event_name == 'pull_request' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.DEFAULT_TAG }}.{{date 'YYYYMMDD'}}

      - name: Build Image
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: ./Containerfile
          image: ${{ env.IMAGE_NAME }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          oci: false

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          image: ${{ env.IMAGE_NAME }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          tags: ${{ steps.metadata.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v2.6.3

      - name: Sign container image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}${VARIANT}"

          echo "Signing digest: ${DIGEST}"

          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_FULL}@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          VARIANT: ${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          DIGEST: ${{ steps.push.outputs.digest }}

  update_bazzite_digests:
    name: Update base image digests
    needs:
      - check_base_images
      - build_push

    if: |
      always() &&
      needs.build_push.result == 'success' &&
      needs.check_base_images.outputs.changed == 'true'

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Save new digests
        run: |
          printf "standard=%s\nnvidia=%s\nnouveau=%s\n" \
            "${{ needs.check_base_images.outputs.standard }}" \
            "${{ needs.check_base_images.outputs.nvidia }}" \
            "${{ needs.check_base_images.outputs.nouveau }}" \
            > .github/bazzite-digests

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .github/bazzite-digests
          git commit -m "Update Bazzite base image digests"
          git push

